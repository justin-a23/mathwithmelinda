version: 1
backend:
  phases:
    build:
      commands:
        # Gen 2. Replaces `amplifyPush --simple` (Gen 1 CLI). This deploys the
        # backend defined in amplify/backend.ts and writes amplify_outputs.json,
        # which both the client (app/AmplifyProvider.tsx) and the server routes
        # (app/lib/appsync.ts) read — so they cannot drift onto different
        # backends. Must run before the frontend phase.
        # Same install strategy the frontend phase uses — see the preBuild
        # comment there for why the lockfile must be kept.
        - rm -rf node_modules
        - npm install --cache .npm
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # KEEP the lockfile. Deleting it made every deploy re-resolve the whole
        # tree against whatever was newest on npm — 1,049 packages drifted
        # between the last good build (#292, Jul 29) and #293, and one of them
        # (CSS pipeline: postcss 8.5.8→8.5.25, jiti, enhanced-resolve, …)
        # crashes Turbopack's postcss loader subprocess on linux, failing
        # builds #293-#295 on commits that touched no CSS at all.
        #
        # The original reason for deleting it — a macOS-generated lockfile
        # missing linux-x64 native binaries (npm/cli#4828) — is why this is
        # `npm install` and NOT `npm ci`: install honors every locked version
        # but also repairs missing platform-specific optional deps at install
        # time (e.g. @tailwindcss/oxide-linux-x64-gnu), whereas ci refuses.
        # node_modules is still removed so the cached darwin tree can't leak in.
        - rm -rf node_modules
        - npm install --cache .npm
    build:
      commands:
        # Amplify Console environment variables are available to the BUILD, but
        # NOT to the Next.js SSR compute that serves /api routes. Without this,
        # every server route reading process.env at request time sees undefined.
        #
        # This was not theoretical: on 2026-07-28 archive-student deleted two
        # students' Cognito accounts and then threw "APPSYNC_API_KEY is not set"
        # before recording the archive, leaving them unable to log in while
        # still listed as active. SES, Zoom and Anthropic-backed routes have the
        # same dependency and would fail the same way.
        #
        # Writing them into .env.production makes them available at runtime.
        # None are NEXT_PUBLIC_-prefixed, so they stay server-side and are not
        # exposed to the browser bundle.
        - >-
          env | grep -E
          '^(APPSYNC_API_KEY|APPSYNC_ENDPOINT|APPSYNC_AUTH_MODE|COGNITO_USER_POOL_ID|COGNITO_CLIENT_ID|ANTHROPIC_API_KEY|SES_SMTP_USERNAME|SES_SMTP_PASSWORD|SES_FROM_EMAIL|ZOOM_ACCOUNT_ID|ZOOM_CLIENT_ID|ZOOM_CLIENT_SECRET|MWM_ACCESS_KEY_ID|MWM_SECRET_ACCESS_KEY|CRON_SECRET|CRON_COGNITO_EMAIL|CRON_COGNITO_PASSWORD|NEXT_PUBLIC_BASE_URL)='
          >> .env.production || echo 'no matching env vars found'
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
